schema_version: "1.1"
name: code-review-correctness
description: >
  #388 on a stand-in repo: the branch sends queued mail and follows every documented standard, but
  carries two seeded runtime defects (a third, `send-mail` stopping at the first failed send, is
  not graded). `send_next` calls the mail provider after the claim commits and before
  the sent mark commits, with no idempotency key, so a crash in between or a send that outlasts the
  lease sends the mail again; and the Outbox tab's test only calls `render_to_string`, so it passes
  when the component renders nothing. dk:code-review finds both on the Correctness axis, and keeps
  `test_an_empty_outbox_lists_nothing`, whose only assertion is `[]` but which fails when `list`
  does nothing (#87).
tags: [code-review]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash]
graders:
  - name: finds-crash-window
    type: llm
    criteria: >
      The review's Correctness section reports that `Outbox.send_next` in ledger/outbox.py calls the
      mail provider outside the transaction that claims the message: the claim commits, then the
      send runs, then `sent_at` commits separately, so a process that dies after the send and before
      the `sent_at` commit (or a send that outlasts the lease) leaves the message to be claimed and
      sent again. Naming the missing idempotency key, or proposing one, counts as the same finding.
      Whether it also appears under another axis does not matter. PASS when the Correctness section
      carries this finding; FAIL when it is absent from the Correctness section, or the
      report has no section headed Correctness.
  - name: finds-empty-test
    type: llm
    criteria: >
      The review's Correctness section reports that the Outbox tab's test in tests/test_outbox.py
      (`test_lists_each_message_and_whether_it_went_out`) only calls `render_to_string` and asserts
      nothing, so it would pass if the component rendered nothing and does not check the rows its
      name claims. Saying it has no assertion, or that it would pass if rendering returned nothing or
      an empty string, counts as this finding. The Correctness axis owns this check: the Standards
      section must not report the test, while a mention under Spec, Comments or the closing summary
      does not matter. PASS when the Correctness section carries this finding and the Standards
      section does not; FAIL when it is absent from the Correctness section, when it is also reported
      under Standards, or the report has no section headed Correctness.
  - name: keeps-valid-empty-result-test
    type: llm
    criteria: >
      tests/test_outbox.py's `test_an_empty_outbox_lists_nothing` asserts that `Outbox.list()` on an
      empty outbox equals `[]`. A `list` that does nothing returns None and fails it, and
      `test_newest_first` covers the non-empty case, so it is a valid test. PASS when the review
      leaves it unreported or accepts it; FAIL when any section calls it an empty test, says it
      cannot fail or would pass on a subject that does nothing, or proposes deleting it.
  - name: four-axes
    type: regex
    pattern: "## Standards[\\s\\S]*## Spec[\\s\\S]*## Correctness[\\s\\S]*## Comments"
  - name: standards-spec-correctness-reviewers
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"dk:reviewer"'
    min: 3
  - name: comments-reviewer
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"dk:comment-reviewer"'
