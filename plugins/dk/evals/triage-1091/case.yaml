schema_version: "1.1"
name: triage-1091
description: >
  jetztbar #1091 (govulncheck red on go1.27.1 and x/net v0.59.0) on a stand-in Go repo, before
  triage: dk:triage reproduces the report, reaches the labels the real triage reached (bug,
  ready-for-agent) and posts an agent brief of the same shape.
tags: [triage]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write]
graders:
  - name: labels
    type: regex
    target: { source: file, path: .tracker/issue-1091.md }
    pattern: "^labels: (?=.*\\bbug\\b)(?=.*\\bready-for-agent\\b)(?!.*needs-triage)(?!.*needs-info)(?!.*wontfix).*$"
    flags: m
  - name: brief-shape
    type: regex
    target: { source: file, path: .tracker/issue-1091.md }
    pattern: "generated by AI during triage[\\s\\S]*## Agent Brief[\\s\\S]*\\*\\*Category:\\*\\* bug[\\s\\S]*\\*\\*Current behavior:\\*\\*[\\s\\S]*\\*\\*Desired behavior:\\*\\*[\\s\\S]*\\*\\*Acceptance criteria:\\*\\*[\\s\\S]*\\*\\*Out of scope:\\*\\*"
  - name: reproduced
    type: regex
    target: { source: file, path: .tracker/govulncheck.log }
    pattern: "^\\./\\.\\.\\. exit=3$"
    flags: m
  - name: brief-content
    type: llm
    focus: { source: file, path: .tracker/issue-1091.md }
    criteria: >
      The triage comment on #1091 says what the real triage of this issue said, in substance:
      (1) it reports reproducing the failure locally with govulncheck (the same 12 findings or exit 3);
      (2) desired behaviour: the module requires go1.27.2 or later and golang.org/x/net v0.60.0 or
      later, and the production image's Go builder stage moves to go1.27.2 or later; (3) acceptance
      criteria include `govulncheck ./...` exiting 0 and the build, vet and test checks passing;
      (4) out of scope excludes unrelated dependency upgrades (and changes to the govulncheck job
      itself, if mentioned). PASS when all four hold.
