schema_version: "1.1"
name: code-review-rereview
description: >
  #388 on a stand-in repo (the code-review-correctness fixture), reviewed by its author: its
  Correctness axis raises the crash window in `Outbox.send_next` as a should or blocker, whose fix
  changes behaviour code. dk:code-review then runs a second round on the fix diff
  (`git diff <round 1's HEAD>`): Correctness, plus Spec only when Spec raised a blocker or should
  whose fix changed behaviour code (it may flag `send-mail` stopping at the first failed send),
  never Standards or Comments, whose findings here are nits or doc fixes; and it stops within its
  two-round budget (#172).
tags: [code-review]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 120
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
graders:
  - name: second-round-at-most-two-reviewers
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"dk:reviewer"'
    min: 4
    max: 5
  - name: one-comments-reviewer
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"dk:comment-reviewer"'
    min: 1
    max: 1
  - name: second-round-on-fix-diff
    type: tool_used
    tool: Agent
    input_match: '^(?=.*"subagent_type"\s*:\s*"dk:reviewer")(?=.*git diff [0-9a-f]{7,40}\b)'
    min: 1
  - name: second-round-is-correctness
    type: llm
    criteria: >
      The final message reports two review rounds: round 1 on all four axes (Standards, Spec,
      Correctness, Comments), and round 2 after a fix to the crash window in `Outbox.send_next`
      (the provider call between the claim's commit and the sent mark's, or the missing idempotency
      key). Round 2 runs Correctness, plus Spec only when the report shows a Spec blocker or should
      whose fix changed behaviour code (code outside tests, comments and docs). PASS when it reports
      exactly two rounds and round 2 ran Correctness and no axis beyond that rule; FAIL when it
      reports one round or three or more, when round 2 left out Correctness, or when it also ran
      Standards or Comments, or Spec with no such Spec finding.
