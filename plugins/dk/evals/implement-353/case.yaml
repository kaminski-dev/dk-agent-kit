schema_version: "1.1"
name: implement-353
description: >
  clientdata #353 (Customer History order), replayed on a stand-in repo: dk:implement takes the
  triaged ticket to a PR into pre-main with evidence, and its report ends with one ready-gate
  verdict, the standard tier stated and a nit-only round ending the review. The tracker is the
  workspace's gh stand-in,
  so the PR is a file, never a real one.
tags: [implement]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 150
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
graders:
  - name: pr-into-pre-main
    type: regex
    target: { source: file, path: .tracker/pr.md }
    pattern: "^base: pre-main$"
    flags: m
  - name: acceptance-passes
    type: regex
    target: { source: file, path: .tracker/pr.md }
    pattern: "^acceptance: pass$"
    flags: m
  - name: unit-tests-pass
    type: regex
    target: { source: file, path: .tracker/pr.md }
    pattern: "^unit tests: pass$"
    flags: m
  - name: names-the-issue
    type: regex
    target: { source: file, path: .tracker/pr.md }
    pattern: "(Closes|Refs) #353"
  - name: evidence
    type: llm
    focus: { source: file, path: .tracker/pr.md }
    criteria: >
      The PR body (after "## Body") has an Evidence section with a before and an after, each backed by
      captured output rather than a claim: the regression test failing on the pre-fix state and passing
      on the branch, or `python3 -m ledger history` output before and after in which the three fields of
      the 2026-10-02 edit go from an arbitrary order (phone, email, city) to field_name order
      (city, email, phone). PASS when at least one such before/after pair is shown with output; FAIL when
      the evidence is missing, only described, or shows the after alone.
  - name: verified
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"dk:verify"'
  - name: reviewed
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"dk:code-review"'
  - name: pr-states-the-tier
    type: regex
    target: { source: file, path: .tracker/pr.md }
    pattern: "\\*\\*Tier:\\*\\* standard"
  - name: nit-only-round-ends-the-review
    type: llm
    criteria: >
      The repo keeps no risk-path list, so the tier is standard (#173). The report names that tier and
      gives the review's rounds and the axes each ran. A round whose findings were all nits (or no
      findings), or whose fixes were only to nits, "also" lines, Standards or Comments findings, or
      touched only tests, comments or docs, ends the review: no later round follows it (#172). PASS
      when the report names the standard tier and no round follows such a round; FAIL when the tier is
      missing, or a second round ran after a round that brought only nits.
  - name: ends-with-one-verdict
    type: llm
    criteria: >
      dk:issue-flow step 6's ready gate ends the handoff of a PR with exactly one of three verdicts:
      Ready to merge, Waiting for required approval, or Blocked. PASS when the final message ends with
      exactly one of them for the PR of #353, as its last line or the last paragraph. A Blocked verdict
      may name, in that same paragraph, what could not be read or what blocks it, since the gate asks
      for that. FAIL when it gives none, gives more than one, or gives one with further report
      sections after it.
