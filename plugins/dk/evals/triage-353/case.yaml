schema_version: "1.1"
name: triage-353
description: >
  clientdata #353 (Customer History order) on a stand-in repo, before triage: dk:triage reaches
  the labels the real triage reached (bug, ready-for-agent) and posts an agent brief of the same shape.
tags: [triage]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write]
graders:
  - name: labels
    type: regex
    target: { source: file, path: .tracker/issue-353.md }
    pattern: "^labels: (?=.*\\bbug\\b)(?=.*\\bready-for-agent\\b)(?!.*needs-triage)(?!.*needs-info)(?!.*wontfix).*$"
    flags: m
  - name: brief-shape
    type: regex
    target: { source: file, path: .tracker/issue-353.md }
    pattern: "generated by AI during triage[\\s\\S]*## Agent Brief[\\s\\S]*\\*\\*Category:\\*\\* bug[\\s\\S]*\\*\\*Current behavior:\\*\\*[\\s\\S]*\\*\\*Desired behavior:\\*\\*[\\s\\S]*\\*\\*Acceptance criteria:\\*\\*[\\s\\S]*\\*\\*Out of scope:\\*\\*"
  - name: brief-content
    type: llm
    focus: { source: file, path: .tracker/issue-353.md }
    criteria: >
      The agent brief posted on #353 says what the real triage of this issue said, in substance:
      (1) desired behaviour: `list_by_entity` returns one entity's rows in a defined order, newest
      operation first and the field rows of one Audit Operation by `field_name`, matching or
      referring to the order `AuditStore.list` already uses; (2) an acceptance criterion asks for a
      test that records one multi-field operation with its fields out of name order and fails on the
      pre-fix query; (3) the `LIMIT`-counts-field-rows concern is kept out of this brief: named out
      of scope, or split into its own issue. PASS when all three hold.
