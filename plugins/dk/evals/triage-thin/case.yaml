schema_version: "1.1"
name: triage-thin
description: >
  #361 on the ledger stand-in says only that some Audit Log entries look wrong: no entry, no value,
  no steps, and the Audit Log's query already defines its order. dk:triage asks the reporter for
  what is missing (needs-info) instead of applying ready-for-agent without a brief it could write.
tags: [triage]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write]
graders:
  - name: needs-info
    type: regex
    target: { source: file, path: .tracker/issue-361.md }
    pattern: "^labels: (?=.*\\bneeds-info\\b)(?!.*\\bready-for-agent\\b)(?!.*\\bneeds-triage\\b).*$"
    flags: m
  - name: no-brief
    type: regex
    target: { source: file, path: .tracker/issue-361.md }
    pattern: "## Agent Brief"
    match: not_contains
  - name: asks-reporter
    type: llm
    focus: { source: file, path: .tracker/issue-361.md }
    criteria: >
      The triage comment on #361 starts with the "generated by AI during triage" disclaimer and asks
      the reporter specific questions that would make the issue workable: which entries look wrong
      (the entity, or when they were made), what they show and what was expected instead, and where
      or how they were seen. PASS when it asks at least two such specific questions; FAIL when there
      is no comment, it asks only for "more information", or it writes an agent brief.
