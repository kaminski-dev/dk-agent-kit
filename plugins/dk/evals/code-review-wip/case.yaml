schema_version: "1.1"
name: code-review-wip
description: >
  The #353 fix branch with work in progress on top: an uncommitted test that reads the audit_logs
  table directly, and an untracked export module that formats a value into its SQL. dk:code-review
  reviews the uncommitted and untracked work too, not only the commits.
tags: [code-review]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash]
graders:
  - name: reviews-uncommitted
    type: llm
    criteria: >
      The review reports that the test `test_one_row_per_changed_field` in tests/test_audit_store.py
      (an uncommitted edit) reads the audit_logs table with its own SQL instead of going through
      AuditStore's methods, against the repo's rule that tests go through `AuditStore`
      (CODING_STANDARDS.md rule 3). The axis it appears under does not matter. PASS when the report
      carries this finding; FAIL when that test is not mentioned, or the review says it looked only
      at the commits.
  - name: reviews-untracked
    type: llm
    criteria: >
      The review reports that `export_entity_type` in ledger/export.py (a new, untracked file) puts
      the `entity_type` value into the SQL text with `%` formatting instead of passing it through a
      `?` parameter, against the repo's rule that SQL takes its values as parameters
      (CODING_STANDARDS.md rule 1). The axis it appears under does not matter. PASS when the report
      carries this finding for ledger/export.py; FAIL when that file is not mentioned, or only the
      committed f-string in `list_by_entity` is reported.
  - name: three-axes
    type: regex
    pattern: "## Standards[\\s\\S]*## Spec[\\s\\S]*## Comments"
