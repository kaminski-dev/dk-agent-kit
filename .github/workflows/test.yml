name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard-bash fixture matrix
        run: python3 -I tests/hooks/test_guard_bash.py
      - name: stop gate fixtures
        run: python3 -I tests/hooks/test_stop_gate.py
      - name: skills frontmatter, references, provenance
        run: python3 -I tests/test_skills.py
      - name: bootstrap merge
        run: bash tests/test_bootstrap.sh
      - name: dk-pg against Docker
        run: bash tests/test_dk_pg.sh
      - name: manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json settings/*.json; do
            jq empty "$f" || exit 1
          done
      - name: plugin validate
        run: npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate .
