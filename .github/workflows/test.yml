name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: claude CLI for plugin validate
        run: npm install -g @anthropic-ai/claude-code@2.1.283
      - name: manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json settings/*.json; do
            jq empty "$f" || exit 1
          done
      - name: every check, each with its seconds
        run: python3 -I tests/run.py
